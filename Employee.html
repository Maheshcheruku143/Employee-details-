<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashline HR - Employee Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<script src="script.js"></script>

<body>

<div class="container">

    <h1>FLASHLINE COMPANY HR</h1>
    <h3>Employee Registration Form</h3>

    <form id="employeeForm">

        <div class="row">

            <div class="input-box">
                <label>First Name</label>
                <input type="text"
                id="firstName"
                placeholder="Enter First Name"
                required>
            </div>

            <div class="input-box">
                <label>Surname</label>
                <input type="text"
                id="surname"
                placeholder="Enter Surname"
                required>
            </div>

        </div>


        <div class="row">

            <div class="input-box">
                <label>Father Name</label>
                <input type="text"
                id="fatherName"
                placeholder="Father Name"
                required>
            </div>

            <div class="input-box">
                <label>Mother Name</label>
                <input type="text"
                id="motherName"
                placeholder="Mother Name"
                required>
            </div>

        </div>


        <div class="row">

            <div class="input-box">

                <label>Gender</label>

                <select id="gender">

                    <option>Male</option>
                    <option>Female</option>

                </select>

            </div>

            <div class="input-box">

                <label>Qualification</label>

                <select id="qualification">

                    <option>10th</option>

                    <option>Diploma</option>

                    <option>B.Tech</option>

                    <option>Degree</option>

                </select>

            </div>

        </div>


        <div class="row">

            <div class="input-box">

                <label>Marital Status</label>

                <select id="marital">

                    <option>Unmarried</option>

                    <option>Married</option>

                </select>

            </div>

            <div class="input-box">

                <label>Date Of Birth</label>

                <input type="date"
                id="dob">

            </div>

        </div>


        <div class="row">

            <div class="input-box">

                <label>Mobile Number</label>

                <input
                type="tel"
                id="mobile"
                placeholder="9876543210"
                required>

            </div>

            <div class="input-box">

                <label>Email</label>

                <input
                type="email"
                id="email"
                placeholder="example@gmail.com">

            </div>

        </div>


        <div class="row">

            <div class="input-box full">

                <label>Present Address</label>

                <textarea
                id="presentAddress"
                rows="4"
                placeholder="Enter Present Address"></textarea>

            </div>

        </div>


        <div class="row">

            <div class="input-box full">

                <label>Permanent Address</label>

                <textarea
                id="permanentAddress"
                rows="4"
                placeholder="Enter Permanent Address"></textarea>

            </div>

        </div>


        <div class="row">

            <div class="input-box">

                <label>Passport Photo</label>

                <input
                type="file"
                id="photo"
                accept="image/*">

            </div>

            <div class="input-box">

                <label>Resume</label>

                <input
                type="file"
                id="resume"
                accept=".pdf,.doc,.docx">

            </div>

        </div>


        <button type="submit" class="submit-btn">

            SUBMIT
<div id="result" style="display:none; margin-top:30px;">

    <h2>Employee Registered Successfully</h2>

    <p id="empId"></p>

    <div id="qrcode"></div>

    <br>

    <button onclick="window.print()">Print Form</button>

</div>
        </button>

    </form>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<script type="module" src="firebase.js"></script>
<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="script.js"></script>
</body>
</html>
